services:
  postgres:
    image: postgres:16
    container_name: aevor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: aevor
      POSTGRES_PASSWORD: aevor
      POSTGRES_DB: aevor

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aevor -d aevor"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
