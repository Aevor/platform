name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aevor-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: services/api/go.sum

      - name: Check formatting
        working-directory: services/api
        shell: bash
        run: |
          mapfile -d '' go_files < <(find . -type f -name '*.go' -print0)
          unformatted="$(printf '%s\0' "${go_files[@]}" | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files need gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
          echo "All ${#go_files[@]} Go files are formatted."
    
      - name: Vet
        working-directory: services/api
        run: go vet ./...

      - name: Test with race detector
        working-directory: services/api
        run: go test -race ./...

      - name: Build
        working-directory: services/api
        run: go build ./...
